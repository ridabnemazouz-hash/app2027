services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanzigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: hanzigo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - hanzigo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hanzigo']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hanzigo_pg:
