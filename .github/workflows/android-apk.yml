name: Android APK (test build)

on:
  workflow_dispatch:
  push:
    branches: [original-design-updates, hanzigo-original-apk]
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install root dependencies (shared packages)
        run: npm ci --no-audit --no-fund

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: hanzigo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
